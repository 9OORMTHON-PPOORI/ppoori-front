name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 배포는 Vercel Git 연동이 담당한다. 이 워크플로는 검증만 수행한다.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입·린트·포맷·테스트·빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: 의존성 설치
        run: yarn install --frozen-lockfile

      - name: 타입 검사
        run: yarn typecheck

      - name: 린트
        run: yarn lint:strict

      - name: 포맷 검사
        run: yarn format:check

      - name: 테스트
        run: yarn test

      # 환경변수가 없으면 API 프록시만 비활성화되고 빌드는 통과한다.
      - name: 빌드
        run: yarn build
